name: Validate VPS management code
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash scripts
        shell: bash
        run: |
          bash -n deploy_vps_claude.sh
          bash -n install_manager.sh
          bash -n install_aimili_strict.sh
          bash -n resume_deploy.sh
      - name: Check Python sources
        run: |
          python3 -m py_compile vp_manager.py
          python3 -m py_compile aimili/vpngate_manager.py
      - name: Regression test for AI Mili Latin-1 stdout crash
        run: python3 tests/test_aimili_encoding.py
      - name: Assert strict-residential integration points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('aimili/vpngate_manager.py').read_text(encoding='utf-8')
          assert 'def strict_residential_match(' in s
          assert 'def require_residential_exit_ip(' in s
          assert 'routing_ip_type == "residential_strict"' in s
          assert s.count('not in ("all", "residential", "residential_strict", "hosting")') == 2
          assert "data-value=\"residential_strict\"" in s
          assert 'require_residential_exit_ip(res.get("ip", ""))' in s
          assert 'and not strict_residential_match(node):' in s
          print('Strict-residential checks passed')
          PY

  distro-preflight:
    name: Detect ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:24.04
          - alpine:3.21
          - fedora:42
          - rockylinux/rockylinux:10
    steps:
      - uses: actions/checkout@v4
      - name: Check OS and package family without changing system
        shell: bash
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$DISTRO_IMAGE" sh -ec '
            if ! command -v bash >/dev/null 2>&1; then
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache bash
              else
                echo "Bash missing in base image" >&2
                exit 1
              fi
            fi
            bash -n /repo/deploy_vps_claude.sh
            bash /repo/deploy_vps_claude.sh --preflight
          '

  apt-broken-source:
    name: Detect malformed third-party Debian APT source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure preflight refuses malformed repository without modifying sources
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo:ro" debian:13 sh -ec '
            printf "Types: deb\nURIs: not-an-uri\nSuites: trixie\nComponents: main\n" > /etc/apt/sources.list.d/sagernet.sources
            if bash /repo/deploy_vps_claude.sh --preflight > /tmp/preflight.log 2>&1; then
              echo "Preflight unexpectedly accepted a malformed source"
              cat /tmp/preflight.log
              exit 1
            fi
            cat /tmp/preflight.log
            grep -q "APT repository validation failed" /tmp/preflight.log
            grep -q "sagernet.sources" /tmp/preflight.log
            test -f /etc/apt/sources.list.d/sagernet.sources
          '
