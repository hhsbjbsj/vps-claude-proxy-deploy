name: Validate direct-only VPS edition
on:
  push:
    branches: [no-aimili]
  pull_request:
    branches: [no-aimili]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check direct-only shell scripts
        shell: bash
        run: |
          bash -n deploy_vps_claude.sh
          bash -n install_manager.sh
      - name: Verify Python
        run: |
          python3 -m py_compile vp_manager.py
          python3 tests/test_vp.py
          python3 tests/test_vp_encoding.py
      - name: Ensure no Aimili/VPNGate runtime integration is packaged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          deploy=Path('deploy_vps_claude.sh').read_text()
          manager=Path('vp_manager.py').read_text()
          installer=Path('install_manager.sh').read_text()
          # Allow prose explaining what is excluded, but refuse executable integration.
          for name in ('AIMILIVPN_NONINTERACTIVE', 'install_aimili_strict',
                       'aimili-residential', 'vpngate_manager.py',
                       '127.0.0.1:7928', '8787/tcp', 'socks5h://'):
              for fname, contents in (('deploy',deploy), ('manager',manager), ('installer',installer)):
                  assert name not in contents, (fname, name)
          assert "ml status" not in deploy
          assert "sub.add_parser('residential-strict')" not in manager
          assert '/no-aimili/' in deploy
          assert '/no-aimili/' in installer
          assert "backup-8443" in deploy and "backup-direct" in deploy
          assert not Path('aimili').exists()
          assert not Path('install_aimili_strict.sh').exists()
          print('PASS: direct-only edition has no Aimili runtime packaging')
          PY

  distro-preflight:
    name: Detect ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:24.04
          - alpine:3.21
          - fedora:42
          - rockylinux/rockylinux:10
    steps:
      - uses: actions/checkout@v4
      - name: Check OS and package family without changing system
        shell: bash
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$DISTRO_IMAGE" sh -ec '
            if ! command -v bash >/dev/null 2>&1; then
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache bash
              else
                echo "Bash missing in base image" >&2
                exit 1
              fi
            fi
            bash -n /repo/deploy_vps_claude.sh
            bash /repo/deploy_vps_claude.sh --preflight
          '

  apt-broken-source:
    name: Detect malformed third-party Debian APT source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure preflight refuses malformed repository without modifying sources
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo:ro" debian:13 sh -ec '
            printf "Types: deb\nURIs: not-an-uri\nSuites: trixie\nComponents: main\n" > /etc/apt/sources.list.d/sagernet.sources
            if bash /repo/deploy_vps_claude.sh --preflight > /tmp/preflight.log 2>&1; then
              echo "Preflight unexpectedly accepted a malformed source"
              cat /tmp/preflight.log
              exit 1
            fi
            cat /tmp/preflight.log
            grep -q "APT repository validation failed" /tmp/preflight.log
            grep -q "sagernet.sources" /tmp/preflight.log
            test -f /etc/apt/sources.list.d/sagernet.sources
          '
